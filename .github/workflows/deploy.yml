# Deploys the static website (docs/) to the Xtratech web server over SSH.
# Does nothing until the repository secrets below are added, so it is safe to leave enabled.
#
# Required secrets (Settings -> Secrets and variables -> Actions):
#   SSH_HOST         server hostname or IP
#   SSH_USER         deploy user on the server
#   SSH_PRIVATE_KEY  private key for that user (use a dedicated deploy key, not a personal one)
#   SSH_KNOWN_HOSTS  output of: ssh-keyscan -p <port> <host>   (pins the server identity)
#   DEPLOY_PATH      web root on the server, e.g. /var/www/xtratechgs.com/
# Optional:
#   SSH_PORT         defaults to 22
name: Deploy website

on:
  push:
    branches: [main]
    paths: ["docs/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-website
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_SECRETS: ${{ secrets.SSH_HOST != '' && secrets.SSH_PRIVATE_KEY != '' && secrets.DEPLOY_PATH != '' }}
    steps:
      - name: Check configuration
        if: env.HAS_SECRETS != 'true'
        run: echo "Deploy secrets are not configured yet - skipping. See .github/workflows/deploy.yml for the list."

      - uses: actions/checkout@v4
        if: env.HAS_SECRETS == 'true'

      - name: Prepare SSH
        if: env.HAS_SECRETS == 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload docs/ to server
        if: env.HAS_SECRETS == 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          # No --delete on purpose: files already on the server are never removed.
          # Add --delete only if the web root is dedicated to this site.
          rsync -az --itemize-changes \
            -e "ssh -i ~/.ssh/deploy_key -p ${SSH_PORT:-22} -o StrictHostKeyChecking=yes" \
            docs/ "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}"
